[workspace]
resolver = "3"
members = [
    "crates/cad-model",
    "crates/cad-dwg",
    "crates/cad-native",
    "crates/cad-dxf",
    "crates/cad-core",
    "crates/cad-ffi",
    "crates/cad-view",
    "apps/cad-cli",
    "xtask",
]
# The egui viewport has third-party dependencies and is built apart (its own
# workspace and lock file), so this one stays dependency-free.
exclude = ["apps/viewport"]

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

# No third-party crates anywhere in this workspace. Everything is written
# from scratch against the Rust standard library only. See docs/PROVENANCE.md.
[workspace.dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
