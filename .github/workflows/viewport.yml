name: viewport

# The desktop viewport (apps/viewport) is built apart from the rest: it is
# the one part of the repository with third-party crates (egui, eframe), so
# the dependency-free jobs in build.yml never touch it.

on:
  push:
    branches-ignore: [gh-pages]
    paths:
      - "apps/viewport/**"
      - "crates/**"
      - ".github/workflows/viewport.yml"
  pull_request:
    paths:
      - "apps/viewport/**"
      - "crates/**"
      - ".github/workflows/viewport.yml"
  workflow_dispatch:

jobs:
  viewport:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: blackcad-viewport-linux-x86_64
            bin: apps/viewport/target/release/blackcad
          - os: windows-latest
            artifact: blackcad-viewport-windows-x86_64
            bin: apps/viewport/target/release/blackcad.exe
          - os: macos-latest
            artifact: blackcad-viewport-macos-arm64
            bin: apps/viewport/target/release/blackcad
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/viewport
    steps:
      - uses: actions/checkout@v5
      - name: Linux libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Print lock
        if: runner.os == 'Linux'
        run: |
          cargo generate-lockfile
          echo "LOCKBEGIN"; cat Cargo.lock; echo "LOCKEND"
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
      # The lock file is not in the repository yet; the first green run
      # leaves the one it resolved here, to be committed.
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: viewport-cargo-lock
          path: apps/viewport/Cargo.lock
