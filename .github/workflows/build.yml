name: build

on:
  push:
    # gh-pages holds the published web app (the pages job), not sources.
    branches-ignore: [gh-pages]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the Linux binary compatible with glibc 2.35+.
          - os: ubuntu-22.04
            artifact: cad-linux-x86_64
            bin: target/release/cad
          - os: windows-latest
            artifact: cad-windows-x86_64
            bin: target/release/cad.exe
          - os: macos-latest
            artifact: cad-macos-arm64
            bin: target/release/cad
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Lint
        shell: bash
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Lint" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Test
        shell: bash
        run: |
          cargo test --release 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Test" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Build
        shell: bash
        run: |
          cargo build --release 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Build" "$RUNNER_TEMP/step.log"; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}

  msrv:
    # The oldest Rust the workspace says it builds with (rust-version in
    # Cargo.toml) must build it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "MSRV $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - name: Check
        shell: bash
        run: |
          cargo check --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "MSRV check" "$RUNNER_TEMP/step.log"; exit 1; }

  android:
    # The Android test viewer (apps/android) as a debug APK. GitHub's Ubuntu
    # image comes with the Android SDK, several NDKs, JDK 17 and Rust; this
    # job adds Rust's Android targets and a pinned Gradle.
    runs-on: ubuntu-24.04
    env:
      GRADLE_VERSION: "9.6.1"
      GRADLE_SHA256: 9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14
      APK: apps/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Native library
        # The newest NDK on the image rather than its default one.
        shell: bash
        run: |
          cargo xtask android --abi all ${ANDROID_NDK_LATEST_HOME:+--ndk "$ANDROID_NDK_LATEST_HOME"} 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Native library" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Gradle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
      - name: APK
        shell: bash
        run: |
          gradle --no-daemon -p apps/android assembleDebug 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "APK" "$RUNNER_TEMP/step.log"; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: cad-viewer-debug-apk
          path: ${{ env.APK }}
      - name: Check the APK
        # Native libraries aligned for 16 KB pages, and no code but the
        # app's own: no third-party libraries slipped in.
        shell: bash
        run: |
          bash .github/check-apk.sh "$APK" 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Check the APK" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Signed release APK
        # Only when the upload keystore is in the repository's secrets
        # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; see apps/android/README.md).
        # Pull requests from forks and repositories without them skip it, and
        # the release then offers the debug APK only.
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing keystore in the secrets: skipping the release APK."
            exit 0
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          {
            gradle --no-daemon -p apps/android assembleRelease
            bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            rel=apps/android/app/build/outputs/apk/release/app-release.apk
            "$bt/apksigner" verify --verbose --print-certs "$rel"
            bash .github/check-apk.sh "$rel"
            mkdir -p dist-apk && cp "$rel" dist-apk/app-release.apk
            echo "SIGNED=1" >> "$GITHUB_ENV"
          } 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Signed release APK" "$RUNNER_TEMP/step.log"; exit 1; }
          rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v6
        if: env.SIGNED == '1'
        with:
          name: cad-viewer-release-apk
          path: dist-apk/app-release.apk

  web:
    # The browser workbench (apps/web): the core built for WebAssembly, the
    # app put together in dist/web/ and as one file, dist/BlackCAD.html, and
    # the core checked through the page's own glue (apps/web/tests). Both
    # are uploaded on every run; the pages job publishes them from main.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Lint
        # The WebAssembly entry points build only for wasm, so the build
        # job's lint does not see them.
        shell: bash
        run: |
          cargo clippy -p cad-ffi --lib --target wasm32-unknown-unknown -- -D warnings 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Web lint" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Build
        shell: bash
        run: |
          cargo xtask web 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Web build" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Test the core in the page's glue
        shell: bash
        run: |
          node --version
          node apps/web/tests/core.test.mjs dist/web/core.wasm corpus/mosaiciron-mi201 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Web core test" "$RUNNER_TEMP/step.log"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: blackcad-web
          path: dist/web
      - uses: actions/upload-artifact@v7
        # Not zipped: the run's page offers BlackCAD.html itself.
        with:
          path: dist/BlackCAD.html
          archive: false

  app:
    # BlackCAD, the application (apps/shell): the workbench (the web job's
    # build) in the system's own webview, the Rust engine native in the same
    # process. Tauri 2 builds it and its installers on each system for that
    # system. Unsigned until the signing secrets exist (apps/shell/README.md).
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: the .deb, .rpm and AppImage run on glibc 2.35+.
          - os: ubuntu-22.04
            artifact: blackcad-app-linux
            args: ""
            bundles: |
              apps/shell/target/release/bundle/deb/*.deb
              apps/shell/target/release/bundle/rpm/*.rpm
              apps/shell/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact: blackcad-app-windows
            args: ""
            bundles: |
              apps/shell/target/release/bundle/msi/*.msi
              apps/shell/target/release/bundle/nsis/*.exe
          # One app for Apple silicon and Intel Macs.
          - os: macos-latest
            artifact: blackcad-app-macos
            args: --target universal-apple-darwin
            bundles: |
              apps/shell/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: blackcad-web
          path: dist/web
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Same version as the engine
        shell: bash
        run: |
          root=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          app=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/shell/Cargo.toml | head -n 1)
          echo "engine $root, app $app"
          [ "$root" = "$app" ] || { echo "::error::apps/shell/Cargo.toml version $app differs from the workspace's $root"; exit 1; }
      - name: Lint
        shell: bash
        working-directory: apps/shell
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash ../../.github/annotate-failure.sh "App lint" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Test
        shell: bash
        working-directory: apps/shell
        run: |
          cargo test 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash ../../.github/annotate-failure.sh "App test" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Build the app and its installers
        shell: bash
        working-directory: apps/shell
        run: |
          # The web job built dist/web already.
          npx --yes @tauri-apps/cli@2 build ${{ matrix.args }} --ci --config '{"build":{"beforeBuildCommand":""}}' 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash ../../.github/annotate-failure.sh "App build" "$RUNNER_TEMP/step.log"; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  app-android:
    # The same app for Android (Tauri 2's Android target): the engine built
    # for the phone's processor, the workbench in the Android System WebView.
    # One APK for arm64, 32-bit ARM and x86_64 phones, tablets and emulators.
    needs: [web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: blackcad-web
          path: dist/web
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Android project
        # Generated from tauri.conf.json each time, with the app's icons.
        shell: bash
        working-directory: apps/shell
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          npx --yes @tauri-apps/cli@2 android init --ci 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash ../../.github/annotate-failure.sh "Android project" "$RUNNER_TEMP/step.log"; exit 1; }
          cp -R icons/android/. gen/android/app/src/main/res/
      - name: APK
        shell: bash
        working-directory: apps/shell
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          npx --yes @tauri-apps/cli@2 android build --apk --ci --target aarch64 --target armv7 --target x86_64 --config '{"build":{"beforeBuildCommand":""}}' 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash ../../.github/annotate-failure.sh "Android build" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Sign
        # With the upload keystore in the repository's secrets
        # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) when they are set, so each
        # build installs over the last; otherwise with a key made for this
        # build, which installs but cannot update an earlier one.
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned=$(find apps/shell/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
          [ -n "$unsigned" ] || { echo "::error::no unsigned release APK was built"; exit 1; }
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/sign.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "Signing with the upload key from the secrets."
          else
            KS_PASS=$(openssl rand -hex 16); KEY_PASS=$KS_PASS; KEY_ALIAS=blackcad
            keytool -genkeypair -keystore "$ks" -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BlackCAD test build" >/dev/null
            echo "::notice::No signing secrets: the APK is signed with a key made for this build."
          fi
          mkdir -p dist-app
          "$bt/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out dist-app/BlackCAD-android.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs dist-app/BlackCAD-android.apk
          rm -f "$ks"
      - uses: actions/upload-artifact@v6
        with:
          name: blackcad-app-android
          path: dist-app/BlackCAD-android.apk
          if-no-files-found: error

  pages:
    # The web app and BlackCAD.html published from main once every job has
    # passed: the gh-pages branch holds a single commit, replaced each time,
    # which GitHub Pages serves (Settings → Pages → Build and deployment:
    # Deploy from a branch, gh-pages, / (root)).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, msrv, android, web, app, app-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # The custom domain, for this repository only (forks publish without one).
      PAGES_DOMAIN: ${{ github.repository == 'withshalom/blackcad' && 'cad.mosaiciron.com' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: blackcad-web
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: BlackCAD.html
          path: site
      - name: Publish to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/publish-pages.sh site 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Publish" "$RUNNER_TEMP/step.log"; exit 1; }

  release:
    # The downloads of the latest main, once every job has passed: the
    # app's installers for Windows, macOS, Linux and Android, the command-line
    # builds, the Android test viewer, the web app and BlackCAD.html, as
    # the files of one pre-release tagged main-latest, replaced on each push
    # (package-release.sh names the files, publish-release.sh publishes them;
    # README.md "Download" links to them). It is not "latest", so it never
    # stands in for a numbered release: those are tags made by hand
    # (CONTRIBUTING.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, msrv, android, web, app, app-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          # Each artifact in a folder of its own name: the three command-line
          # builds and the APK.
          pattern: cad-*
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          # The app's installers for each system, in folders of their own names.
          pattern: blackcad-app-*
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: blackcad-web
          path: artifacts/blackcad-web
      - uses: actions/download-artifact@v8
        with:
          name: BlackCAD.html
          path: artifacts/single-file
      - name: Package
        shell: bash
        run: |
          bash .github/package-release.sh artifacts release 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Package" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Publish to the main-latest pre-release
        shell: bash
        run: |
          sed -e "s/{sha}/$GITHUB_SHA/g" -e "s/{short}/${GITHUB_SHA::7}/g" \
              -e "s|{repo}|$GITHUB_REPOSITORY|g" -e "s/{date}/$(date -u +%Y-%m-%d)/g" \
              .github/release-notes.md >"$RUNNER_TEMP/notes.md"
          bash .github/publish-release.sh release "$RUNNER_TEMP/notes.md" 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Publish release" "$RUNNER_TEMP/step.log"; exit 1; }
