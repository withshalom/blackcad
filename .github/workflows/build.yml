    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # The custom domain, for this repository only (forks publish without one).
      PAGES_DOMAIN: ${{ github.repository == 'withshalom/CAD' && 'cad.mosaiciron.com' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: blackcad-web
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: BlackCAD.html
          path: site
