[package]
name = "cad-view"
description = "BlackCAD's viewport logic with no GUI toolkit: decodes the display list and turns it into screen shapes, with pan and zoom, grid and snap replies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

# Nothing here knows about a GUI toolkit: the egui viewport (apps/viewport)
# draws what this crate computes. Only the workspace's own crates, no
# third-party ones.
[dependencies]
# The session the viewer drives.
cad-ffi = { path = "../cad-ffi" }
